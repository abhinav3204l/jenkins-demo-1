<!-- main.html (Frameset) -->
<!DOCTYPE html>
<html lang="en">
<head>
<style>
        table {
            width: 50%;
            border-collapse: collapse;
            margin: 20px auto;
            text-align: center;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVSR College</title>
</head>
<frameset rows="20%,*">
    <frame src="header.html" name="header">
    <frameset cols="30%,*">
        <frame src="branches.html" name="sidebar">
        <frame src="default.html" name="main">
    </frameset>
</frameset>
</html>
